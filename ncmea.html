<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f2b46">
<title>NCMEA 備戰中心｜2026H2023</title>
<style>
:root{
  --navy:#0f2b46; --navy2:#16405f; --accent:#f59e0b; --accent2:#fbbf24;
  --bg:#f2f5f9; --card:#ffffff; --ink:#1e2a38; --sub:#5b6b7c; --line:#e3e9f0;
  --ok:#16a34a; --warn:#dc2626; --info:#2563eb;
  --catA:#2563eb; --catB:#0f766e; --catC:#b45309; --catD:#7c3aed; --catE:#be185d; --catF:#475569; --catM:#f59e0b;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--ink); font-size:15.5px; line-height:1.65; padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button{font-family:inherit}
h1,h2,h3,h4{line-height:1.4}
small{color:var(--sub)}
a{color:var(--info)}

/* ── header ── */
header{position:sticky; top:0; z-index:50; background:linear-gradient(135deg,var(--navy),var(--navy2)); color:#fff; padding:10px 14px calc(10px); box-shadow:0 2px 10px rgba(15,43,70,.25)}
.hd-row{display:flex; align-items:center; gap:10px; max-width:1080px; margin:0 auto}
.hd-title{font-size:17px; font-weight:800; letter-spacing:.5px; white-space:nowrap}
.hd-sub{font-size:11px; opacity:.75; white-space:nowrap}
.hd-count{margin-left:auto; text-align:right; font-size:11px; opacity:.9; line-height:1.3}
.hd-count b{font-size:15px; color:var(--accent2); font-variant-numeric:tabular-nums}
.me-chip{background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3); color:#fff; border-radius:99px; padding:4px 10px; font-size:12.5px; cursor:pointer; white-space:nowrap}

/* ── layout ── */
main{max-width:1080px; margin:0 auto; padding:14px 12px 30px}
.tab{display:none; animation:fadein .18s ease}
.tab.on{display:block}
@keyframes fadein{from{opacity:0; transform:translateY(4px)}to{opacity:1; transform:none}}
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px; box-shadow:0 1px 3px rgba(20,40,60,.05)}
.card h3{margin:0 0 8px; font-size:16px}
.grid2{display:grid; grid-template-columns:1fr; gap:12px}
@media(min-width:820px){ .grid2{grid-template-columns:1fr 1fr} }

/* ── bottom nav ── */
nav#nav{position:fixed; bottom:0; left:0; right:0; z-index:60; background:#fff; border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(7,1fr); padding-bottom:env(safe-area-inset-bottom); box-shadow:0 -2px 12px rgba(20,40,60,.08)}
nav#nav button{background:none; border:0; padding:7px 0 6px; font-size:10.5px; color:var(--sub); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px}
nav#nav button .ic{font-size:19px; line-height:1}
nav#nav button.on{color:var(--navy); font-weight:700}
nav#nav button.on .ic{transform:scale(1.12)}
@media(min-width:900px){
  body{padding-bottom:20px}
  nav#nav{position:sticky; top:56px; bottom:auto; grid-template-columns:repeat(7,auto); justify-content:center; gap:6px; border-top:0; border-bottom:1px solid var(--line)}
  nav#nav button{flex-direction:row; font-size:13.5px; padding:10px 14px; gap:6px}
}

/* ── generic UI ── */
.btn{border:0; border-radius:10px; padding:9px 16px; font-size:14px; font-weight:700; cursor:pointer; background:var(--navy); color:#fff}
.btn.sec{background:#e8eef5; color:var(--navy)}
.btn.amber{background:var(--accent); color:#3b2600}
.btn.danger{background:var(--warn); color:#fff}
.btn.ghost{background:none; border:1px solid var(--line); color:var(--sub); font-weight:500}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.sm{padding:5px 10px; font-size:12.5px; border-radius:8px}
.chip{display:inline-block; border-radius:99px; padding:2px 10px; font-size:12px; font-weight:600; background:#eef2f7; color:var(--sub); margin:2px 3px 2px 0; border:1px solid transparent}
.chip.click{cursor:pointer}
.chip.on{background:var(--navy); color:#fff}
.badge{display:inline-block; border-radius:6px; padding:1px 7px; font-size:11.5px; font-weight:700; margin-right:4px; vertical-align:1px}
.star{color:#d97706; font-weight:800}
input[type=text],textarea,select{width:100%; border:1.5px solid var(--line); border-radius:10px; padding:9px 12px; font-size:15px; font-family:inherit; background:#fff; color:var(--ink)}
textarea{resize:vertical; min-height:74px}
input:focus,textarea:focus{outline:none; border-color:var(--navy2)}
details.acc{background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:12px; overflow:hidden}
details.acc>summary{list-style:none; cursor:pointer; padding:13px 16px; font-weight:800; font-size:15.5px; display:flex; align-items:center; gap:8px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary:after{content:"▾"; margin-left:auto; color:var(--sub); transition:transform .2s}
details.acc[open]>summary:after{transform:rotate(180deg)}
details.acc>.bd{padding:2px 16px 14px}
table.tb{width:100%; border-collapse:collapse; font-size:13.5px}
table.tb th{background:#f0f4f8; text-align:left; padding:7px 9px; border:1px solid var(--line); white-space:nowrap}
table.tb td{padding:7px 9px; border:1px solid var(--line); vertical-align:top}
.tbwrap{overflow-x:auto}
.progress{height:9px; border-radius:99px; background:#e6ecf3; overflow:hidden}
.progress>i{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,#22c55e,#16a34a); transition:width .4s}
.note-meta{font-size:11.5px; color:var(--sub); margin-top:3px}
.src{display:block; font-size:11px; color:#93a3b3; margin-top:6px}
.warnbox{background:#fff7ed; border:1px solid #fed7aa; border-radius:10px; padding:8px 12px; font-size:13.5px; color:#9a3412; margin-top:8px}
.hl{background:#fef3c7; border-radius:4px; padding:0 3px}

/* ── home hero ── */
.hero{background:linear-gradient(140deg,var(--navy) 0%,var(--navy2) 70%,#1d5a85 100%); color:#fff; border-radius:16px; padding:18px 18px 16px; margin-bottom:12px; position:relative; overflow:hidden}
.hero:before{content:"⚕"; position:absolute; right:-14px; top:-30px; font-size:150px; opacity:.06}
.hero .ttl{font-size:13px; opacity:.85; letter-spacing:1px}
.hero .theme{font-size:15.5px; font-weight:800; margin:4px 0 10px; line-height:1.5}
.cd-days{font-size:44px; font-weight:900; color:var(--accent2); font-variant-numeric:tabular-nums; line-height:1}
.cd-days small{font-size:15px; color:#fff; opacity:.9; font-weight:600}
.cd-hms{font-size:16px; font-variant-numeric:tabular-nums; opacity:.92; margin-top:2px}
.cd-when{font-size:12px; opacity:.75; margin-top:6px}
.miles{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
.mile{background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.22); border-radius:10px; padding:6px 10px; font-size:11.5px; line-height:1.4}
.mile b{display:block; font-size:13px}
.mile.urgent{background:rgba(220,38,38,.28); border-color:#f87171}
.mile.done{opacity:.55; text-decoration:line-through}
.statrow{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:12px}
.stat{background:var(--card); border:1px solid var(--line); border-radius:13px; padding:11px 8px; text-align:center}
.stat b{font-size:21px; display:block; font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px; color:var(--sub)}

/* ── team ── */
.mem{border-left:5px solid var(--mc,#888)}
.mem .avatar{width:42px; height:42px; border-radius:50%; background:var(--mc,#888); color:#fff; font-weight:800; font-size:17px; display:flex; align-items:center; justify-content:center; flex-shrink:0}
.mem .mhd{display:flex; gap:11px; align-items:center; margin-bottom:6px}
.mem .mhd h3{margin:0}
.mem .mhd .jt{font-size:12.5px; color:var(--sub)}
.mem dl{margin:8px 0; font-size:13.8px}
.mem dt{font-weight:700; color:var(--navy2); margin-top:8px; font-size:12.5px}
.mem dd{margin:2px 0 0}
.tasklist{margin:6px 0 0; padding:0; list-style:none}
.tasklist li{display:flex; gap:9px; align-items:flex-start; padding:7px 0; border-top:1px dashed var(--line); font-size:14px}
.tasklist li:first-child{border-top:0}
.ckbox{width:21px; height:21px; border-radius:6px; border:2px solid #b8c4d0; background:#fff; cursor:pointer; flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center; font-size:14px; color:#fff}
.ckbox.on{background:var(--ok); border-color:var(--ok)}
.ck-done{color:#8798a8; text-decoration:line-through}
.ck-meta{display:block; font-size:11px; color:#94a6b6}

/* ── flashcards ── */
.qitem{border:1px solid var(--line); border-radius:12px; margin-bottom:10px; overflow:hidden; background:#fff}
.qitem>summary{list-style:none; cursor:pointer; padding:11px 13px; font-weight:700; font-size:14.5px; display:flex; gap:8px; align-items:flex-start}
.qitem>summary::-webkit-details-marker{display:none}
.qitem .qa{padding:0 14px 13px; font-size:14.5px}
.qtag{flex-shrink:0; margin-top:1px}
.lvl{display:inline-flex; gap:6px; margin-top:10px}
.lvl button{border:1.5px solid var(--line); background:#fff; border-radius:8px; padding:4px 10px; font-size:13px; cursor:pointer}
.lvl button.on{border-color:var(--navy); background:var(--navy); color:#fff}
#fcOverlay{position:fixed; inset:0; background:rgba(10,25,40,.94); z-index:100; display:none; flex-direction:column; padding:14px}
#fcOverlay.on{display:flex}
.fc-top{display:flex; align-items:center; color:#cdd9e4; font-size:13px; gap:10px}
.fc-card{flex:1; margin:14px auto; width:100%; max-width:660px; background:#fff; border-radius:18px; padding:22px 20px; overflow-y:auto; display:flex; flex-direction:column; box-shadow:0 10px 40px rgba(0,0,0,.4)}
.fc-q{font-size:19px; font-weight:800; line-height:1.55}
.fc-a{font-size:15.5px; margin-top:14px; border-top:2px dashed var(--line); padding-top:14px}
.fc-hint{margin-top:auto; padding-top:18px; text-align:center; color:var(--sub); font-size:13px}
.fc-btns{display:flex; gap:9px; justify-content:center; padding-bottom:env(safe-area-inset-bottom)}
.fc-btns .btn{flex:1; max-width:150px; padding:13px 0; font-size:15px}
.deckbar{display:flex; flex-wrap:wrap; gap:4px; margin-bottom:8px}

/* ── plan/timeline ── */
.period{position:relative; padding-left:24px}
.period:before{content:""; position:absolute; left:7px; top:6px; bottom:-14px; width:2.5px; background:#d5dfe9}
.period:last-child:before{bottom:auto; height:20px}
.period .dot{position:absolute; left:0; top:4px; width:17px; height:17px; border-radius:50%; background:#fff; border:4px solid var(--navy2)}
.period.now .dot{border-color:var(--accent); box-shadow:0 0 0 5px rgba(245,158,11,.25)}
.period.past .dot{border-color:#9fb0c0}
.period h4{margin:0 0 2px; font-size:15.5px}
.period .rng{font-size:12px; color:var(--sub); margin-bottom:6px}

/* ── chat ── */
#chatBox{height:56vh; overflow-y:auto; padding:6px 2px; display:flex; flex-direction:column; gap:8px}
.msg{max-width:82%; align-self:flex-start}
.msg.mine{align-self:flex-end; text-align:right}
.msg .bub{display:inline-block; background:#fff; border:1px solid var(--line); border-radius:13px 13px 13px 4px; padding:8px 12px; font-size:14.5px; text-align:left; white-space:pre-wrap; word-break:break-word}
.msg.mine .bub{background:var(--navy); color:#fff; border-color:var(--navy); border-radius:13px 13px 4px 13px}
.msg .who{font-size:11.5px; color:var(--sub); margin:0 4px 2px}
.daysep{text-align:center; font-size:11.5px; color:#94a6b6; margin:8px 0 2px}
.chatline{display:flex; gap:8px; margin-top:10px}
.chatline input{flex:1}

/* ── meeting ── */
#jitsiWrap{display:none; border-radius:13px; overflow:hidden; border:1px solid var(--line); background:#000}
#jitsiWrap iframe{width:100%; height:52vh; border:0; display:block}
#liveLines{max-height:38vh; overflow-y:auto; background:#0f2033; color:#dce8f2; border-radius:12px; padding:10px 13px; font-size:14px}
#liveLines .ln{margin-bottom:6px}
#liveLines .ln b{color:var(--accent2); font-weight:700}
#liveLines .interim{opacity:.55; font-style:italic}
.recdot{display:inline-block; width:10px; height:10px; border-radius:50%; background:#dc2626; margin-right:6px; animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.minutes{background:#f8fafc; border:1px solid var(--line); border-radius:12px; padding:12px 15px; font-size:14.5px}
.minutes h4{margin:12px 0 5px; font-size:15px; color:var(--navy2)}
.minutes h4:first-child{margin-top:0}
.minutes ul{margin:4px 0; padding-left:22px}

/* ── export ── */
#packPreview{background:#fff; border:1px solid var(--line); border-radius:13px; padding:16px; max-height:60vh; overflow-y:auto; font-size:14px}

/* ── gate & toast ── */
#gate{position:fixed; inset:0; z-index:200; background:linear-gradient(150deg,var(--navy),#1d5a85); display:none; align-items:center; justify-content:center; padding:18px}
#gate.on{display:flex}
.gate-card{background:#fff; border-radius:18px; padding:24px 22px; width:100%; max-width:420px; box-shadow:0 18px 60px rgba(0,0,0,.4)}
.gate-card h2{margin:0 0 2px; font-size:20px}
.idgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:14px 0}
.idgrid button{border:1.8px solid var(--line); background:#fff; border-radius:11px; padding:10px 6px; font-size:14.5px; font-weight:700; cursor:pointer}
.idgrid button.on{border-color:var(--navy); background:var(--navy); color:#fff}
#toast{position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px); background:#0f2b46; color:#fff; border-radius:11px; padding:10px 18px; font-size:14px; opacity:0; pointer-events:none; transition:.25s; z-index:300; max-width:88vw; text-align:center}
#toast.on{opacity:1; transform:translateX(-50%)}
.empty{color:#94a6b6; font-size:13.5px; text-align:center; padding:14px 0}
.secttl{font-size:13px; font-weight:800; color:var(--navy2); letter-spacing:1.5px; margin:20px 0 8px; display:flex; align-items:center; gap:8px}
.secttl:after{content:""; flex:1; height:1px; background:var(--line)}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <h2>⚕️ NCMEA 備戰中心</h2>
    <small>2026H2023・轉化臨床危機為教學契機<br>115/8/17（一）15:30 北區第 6 順位</small>
    <div style="font-weight:700; margin-top:14px">我是誰？</div>
    <div class="idgrid" id="gateIds"></div>
    <div style="font-weight:700">團隊通關碼 <small style="font-weight:400">（寫入用；向家豪索取。留空＝訪客唯讀）</small></div>
    <input type="text" id="gateTc" placeholder="輸入通關碼" autocomplete="off" style="margin-top:6px">
    <button class="btn amber" id="gateGo" style="width:100%; margin-top:14px; padding:12px">進入備戰中心 🚀</button>
  </div>
</div>

<header>
  <div class="hd-row">
    <div>
      <div class="hd-title">⚕️ NCMEA 備戰中心</div>
      <div class="hd-sub">2026H2023・8/17 北區第 6 順位</div>
    </div>
    <div class="hd-count" id="hdCount"></div>
    <button class="me-chip" id="meChip" title="切換身分／通關碼">👤</button>
  </div>
</header>

<nav id="nav">
  <button data-tab="home" class="on"><span class="ic">🏠</span>總覽</button>
  <button data-tab="team"><span class="ic">🤝</span>分工</button>
  <button data-tab="cards"><span class="ic">🃏</span>題庫</button>
  <button data-tab="plan"><span class="ic">📅</span>時程</button>
  <button data-tab="chat"><span class="ic">💬</span>討論</button>
  <button data-tab="meet"><span class="ic">🎦</span>會議</button>
  <button data-tab="export"><span class="ic">📦</span>攜帶包</button>
</nav>

<main>
  <section class="tab on" id="tab-home"></section>
  <section class="tab" id="tab-team"></section>
  <section class="tab" id="tab-cards"></section>
  <section class="tab" id="tab-plan"></section>
  <section class="tab" id="tab-chat">
    <div class="card">
      <h3>💬 團隊即時討論</h3>
      <div id="chatBox"></div>
      <div class="chatline">
        <input type="text" id="chatInput" placeholder="輸入訊息，Enter 送出" maxlength="1000">
        <button class="btn" id="chatSend">送出</button>
      </div>
    </div>
  </section>
  <section class="tab" id="tab-meet"></section>
  <section class="tab" id="tab-export"></section>
</main>

<div id="fcOverlay"></div>
<div id="toast"></div>
<script type="module">
/* ═══════════ 30分鐘詢答題庫（v2 手冊陸章，55題）═══════════ */
const CATS={A:'整體運作',B:'確實性',C:'成果表現',D:'檢討與未來',E:'加分項與學術',F:'臨場應對',M:'必背卡'};
const CATCOLOR={A:'var(--catA)',B:'var(--catB)',C:'var(--catC)',D:'var(--catD)',E:'var(--catE)',F:'var(--catF)',M:'var(--catM)'};
const QUESTIONS=[
/* ── Ａ、整體運作：計畫設計、資源與理論 ── */
{id:'A1',cat:'A',star:0,must:0,owners:['黃沛銓','陳俊維'],src:'成果報告書壹一、貳二；準備計畫書陸Q1',
q:'為什麼選擇原位模擬，而不是在模擬中心演練？',
a:`先講教育理由，模擬教室難以複製真實場域的空間限制、設備位置與人員動線，技能遷移受限，這是情境學習理論的核心；本案三大問題中「場域不符」與「忽略團隊動能」，唯有回到真實場域、與真實值班團隊一起演練才能解決。再講證據，Patterson 2013年研究顯示原位模擬幾乎每場都能識別潛在安全威脅，檢出率遠高於傳統模擬室；ILCOR 2025年系統性回顧已正式建議原位模擬應被視為CPR訓練之選項。最後講資源，原位模擬使用現有臨床空間與真實設備，增加的是制度設計而非重資本投資。`},
{id:'A2',cat:'A',star:0,must:0,owners:['黃沛銓','張毓倫'],src:'成果報告書貳、參四；準備計畫書陸Q2',
q:'計畫導入前做過哪些評估（人力、經費、設備、風險）？',
a:`需求評估採三種資料源，一是2022至2024年訓練心得紀錄與院內急救事件報告回顧，二是訓練後質性回饋彙整，三是對實際急救現場以TEAM量表觀察；再以魚骨圖歸納六大類原因，鎖定場域、方法、人員、評量四大介入面向。風險面建立訓練前24小時場地安全評估表、備用急救設備、護理長通報機制，確保訓練不影響臨床運作。`,
extra:'經費與人力具體投入（師資時數、資訊開發資源）書面未載，請備妥數字或口徑。'},
{id:'A3',cat:'A',star:0,must:0,owners:['陳俊維','連君茹'],src:'成果報告書壹五、肆二、肆三、肆四',
q:'四項核心目標多為質性描述，如何判斷達成與否？',
a:`逐一對應可觀察指標。目標一技能勝任力，對應TEAM與STAR量化評量及模組勝任標準（STAR達4分以上）；目標二跨職類合作，對應T-ACLS五構面，總分d_z=2.32、25組全數進步；目標三環境安全，對應累計識別24項LST、12項完成改善並納入常規稽核；目標四永續體系，對應13名認證師資、SOP與腳本庫、3年再認證機制。質性目標搭配可觀察指標，正是CBME「行為可觀察、進步可追蹤、缺口可修補」的落實。`},
{id:'A4',cat:'A',star:1,must:1,owners:['全體'],src:'成果報告書壹二、參二；準備計畫書陸Q4',
q:'請說明你們運用的教育理論。（委員可能隨機點任何成員，全員必背）',
a:`每位成員以2至3句話回答。Kolb體驗學習循環對應60分鐘課程：課前準備是抽象概念，情境演練是具體體驗，GAS匯報是反思觀察與概念化，精熟練習是主動驗證。GAS三步驟：Gather蒐集反應、Analyze分析表現差距、Summarize摘要關鍵學習點。CBME：從以出席率為核心，轉向以勝任能力為依歸，三軌評量即其落實。情境學習：知識習得須植根真實情境脈絡，原位模擬正是最佳體現。刻意練習：即時回饋下的目標導向重複練習，對應15分鐘精熟練習段。`},
{id:'A5',cat:'A',star:1,must:0,owners:['蘇欣怡','范凱淇'],src:'成果報告書參六；準備計畫書陸Q5',
q:'教師工作負荷實際改善多少？有無量化數據？',
a:`誠實以機制與質性證據回答。急救面板卸除計時與節律監控，使引導師回歸純觀察者；急救APP自動產出時間戳記log，免除手動記錄與記憶負擔；TRM網站取代重複講授教材；ReSim使回饋可異地、異步進行。標準化面有情境腳本模板庫、場地備置標準清單與師資輪值制度，降低備課與排班負擔。教師時數節省的量化測量尚未系統執行，已列為後續評估項目。`,
extra:'若有教師負荷相關數據（備課時間、教學意願調查）請備妥；否則守住質性口徑，不現場造數。'},
{id:'A6',cat:'A',star:0,must:0,owners:['黃沛銓','陳俊維'],src:'成果報告書參五、參六、肆七；準備計畫書陸Q6',
q:'本案與其他醫院的高擬真模擬訓練有何區隔？創新在哪裡？',
a:`三點區隔。第一，場域：不是把擬真做得更逼真，而是把訓練搬進真實工作現場，訓練同時系統性產出LST安全改善，達成教學與病安雙重效果。第二，評量：由國際TEAM量表3年縱貫，進階至自主開發STAR-Resus技術量表與T-ACLS非技術技能量表，完成心理計量初步驗證並通過IRB，填補Boet 2019年指出的文獻缺口。第三，閉環：四項自製數位工具與評量、反思匯報、學術發表整合為完整閉環，獲Medical Teacher與JAHA雙期刊認證。`},
{id:'A7',cat:'A',star:1,must:0,owners:['陳俊維','黃沛銓'],src:'成果報告書肆二、肆七、伍四；準備計畫書陸Q7',
q:'為何不直接以院內心臟停止（IHCA）存活率作為成效指標？',
a:`存活率受病人基礎疾病、收治單位與疾病嚴重度等多重干擾，且需長期累積足夠樣本。Theilen 2017年以每月原位模擬持續多年，才顯示兒科加護病房存活率由33%提升至50%。本案依證據層級逐級建立：反應層有幸福感與質性回饋，學習層有TEAM與T-ACLS前後測，行為層有JAHA 2026年論文，以本院真實急救資料證實非技術技能與領導力和機械式CPR部署效率相關，已觸及真實世界行為層級。存活率追蹤已列入2026至2028年目標。`},
{id:'A8',cat:'A',star:0,must:0,owners:['黃沛銓','連君茹'],src:'成果報告書參三、參四、伍三；現場報告成員名單；準備計畫書陸Q8',
q:'維護與持續改善機制為何？若計畫負責人異動怎麼辦？',
a:`制度化設計使計畫不依賴個人。SOP與情境腳本庫已文件化；TTT三階段認證加3年再認證（2小時繼續教育、實地2場、量表評估1場）；師資輪值制度；評量結果常規上傳資料庫做長期趨勢分析；LST納入常規品質稽核；四項數位工具內建於標準流程。跨領域工作小組由急診醫學部主導，屬部門建制而非個人專案。黃副主任由急診醫學部主任轉任教學部副主任，反而有助計畫由單一科部推向全院教學體系。`},
{id:'A9',cat:'A',star:0,must:0,owners:['黃沛銓'],src:'成果報告書壹五；注意事項第2點；準備計畫書陸Q9',
q:'院方的具體支持有哪些？',
a:`行政上，教學部協助認列教學時數，協調護理部、呼吸治療科等多單位參與；空間與流程上，核定原位模擬場地評估表，建立急救車與藥物配合機制；研究倫理上，支持取得IRB審查；並補助數位平台開發與國際會議發表。`,
extra:'經費支持具體項目（設備採購、資訊開發、報名費）請備妥佐證列於造冊第一冊；院方代表若不克出席，本題必須有書面佐證可出示。'},
{id:'A10',cat:'A',star:0,must:0,owners:['黃沛銓','連君茹'],src:'成果報告書伍三、參六；準備計畫書陸',
q:'這套模式成本高嗎？其他醫院要複製，需要什麼條件？',
a:`原位模擬使用現有臨床空間與設備，增量成本主要是師資時間與資訊開發；四項數位工具為院內自製，邊際成本低。複製條件有四：標準化SOP與場地安全評估機制、TTT師資培育制度、情境腳本模板庫、基礎錄影與計時工具。前三項已文件化，具備模組化輸出條件，這也是我們規劃鄰近醫院聯合培訓的基礎。`},
{id:'A11',cat:'A',star:0,must:0,owners:['張毓倫','連君茹'],src:'成果報告書壹五、參一、肆四；準備計畫書陸Q13',
q:'團隊如何形成？跨領域運作有實際例子嗎？',
a:`團隊由急診醫學部與教學部共同組成跨領域工作小組，成員涵蓋醫師、專科護理師與護理師，依職類分工並定期會議。實際例子：2024年起由急診醫學部主導，系統性邀集兒科、婦產科、外科醫師與急重症、產兒護理師、呼吸治療師，於同一急救情境整合演練；LST改善案如兒科急救藥物劑量計算，即由醫師、護理師與藥師跨職類共同完成。`},
{id:'A12',cat:'A',star:0,must:0,owners:['黃沛銓'],src:'附件1-9整體運作第1項、成果報告書壹一、壹三',
q:'本案呼應哪些院內或國家重要議題？',
a:`四個對應。病人安全：以原位模擬主動識別並改善潛在安全威脅，呼應醫院病人安全目標；團隊資源管理：落實TRM於急救教育，呼應醫策會長期推動方向；勝任力導向醫學教育：對應國內CBME政策與PGY訓練改革；教師負荷：以數位工具減輕臨床教師負擔，呼應教學人力留任議題。`},

/* ── Ｂ、確實性：理論、課程與執行細節 ── */
{id:'B1',cat:'B',star:0,must:0,owners:['陳俊維','連君茹'],src:'成果報告書參二、參五；準備計畫書陸Q10',
q:'反思匯報為何選GAS，而非PEARLS或Good Judgment模式？',
a:`GAS為美國心臟學會體系廣泛採用的結構化匯報法，與本案ACLS訓練脈絡及師資既有認證最相容，導入成本低、跨師資一致性最佳。本案並對GAS做在地化增值，將T-ACLS的21個行為錨點嵌入Analyze階段，使「今天Call-Out為何沒做、共享心智模式為何未建立」等反思有可操作的討論框架。各匯報法核心本質相通，工具選擇服務於脈絡。`},
{id:'B2',cat:'B',star:0,must:0,owners:['陳俊維','連君茹'],src:'成果報告書參二；準備計畫書陸Q11',
q:'60分鐘課程中情境只有15分鐘、匯報25分鐘，比例依據為何？',
a:`依模擬教育共識，匯報是學習真正發生之處，時間應不少於情境本身；Kolb循環中反思觀察與抽象概念化是深層學習關鍵，故配置25分鐘GAS。15分鐘情境足以完整執行數輪ACLS週期；其後15分鐘精熟練習針對匯報識別的前2至3項優先改善點刻意練習，完成體驗、反思、概念化、驗證的完整循環。60分鐘總長同時顧及臨床單位可承受的離線時間。`},
{id:'B3',cat:'B',star:1,must:0,owners:['連君茹','蘇欣怡'],src:'成果報告書參四；準備計畫書陸Q12',
q:'如何確保訓練不影響臨床運作與病人安全？曾經取消過嗎？',
a:`訓練前24小時完成場地安全評估表，核查設備位置、急救車藥物、環境障礙，並通知單位護理長、準備備用急救設備；訓練用物與臨床用物明確區隔；情境執行中師資僅於安全疑慮時暫停；遇臨床需求，場地即時讓位，備有備用場地清單。文獻中原位模擬因臨床干擾的取消率約28%（Patterson 2013），本院亦有因臨床緊急狀況延期或取消的紀錄，臨床優先本身就是原位模擬的特性而非缺陷。`,
extra:'本院實際取消或改期場次數，請自訓練紀錄統計備妥。'},
{id:'B4',cat:'B',star:1,must:0,owners:['連君茹','張毓倫'],src:'成果報告書參一、肆一；準備計畫書陸Q13',
q:'跨職類合作是每場都有，還是部分場次？各職類參與比例？',
a:`據實區分演進階段。2022年於急診部啟動時以急診內部醫護為主；2024年起擴大為常態化跨職類整合訓練，每場依情境組成含醫師、護理師與呼吸治療師的值班團隊。累計220人次涵蓋PGY、住院醫師、急診與加護及產房護理師、呼吸治療師。`,
extra:'各職類人次分布與跨職類場次比例，請自訓練紀錄統計備妥；誠實區分階段，避免被追問後顯得誇大。'},
{id:'B5',cat:'B',star:0,must:0,owners:['連君茹','蘇欣怡'],src:'成果報告書參三；準備計畫書陸Q14',
q:'13名師資如何認證？如何確保匯報品質一致？',
a:`TTT三階段。第一階段知識培訓，學習TRM、LST識別、CBME、GAS與三量表操作；第二階段技能實習，至少擔任2場協同引導者並接受資深師資回饋；第三階段獨立執行認證，經2名資深師資以教學觀察評核表通過，認證效期3年，屆期需繼續教育再認證。每場配置雙師資，一人主導、一人觀察記錄，互為品質監督；師資均另具ACLS或BLS教師資格。`},
{id:'B6',cat:'B',star:0,must:0,owners:['連君茹','蘇欣怡'],src:'成果報告書參二、貳一；準備計畫書陸Q15',
q:'情境腳本如何開發與更新？效度由誰把關？',
a:`腳本由跨領域工作小組共同撰寫，涵蓋成人心跳停止、急性心肌梗塞、創傷大出血、兒科心跳停止與產科急救5類，依場域臨床特性調整。腳本含情境設定、病人基本資料、觸發點與教學目標，訓練前24小時完成最終確認。內容依AHA急救指引更新同步修訂，並依臨床通報的LST回饋調整；已建立標準化腳本模板庫，由資深師資審核後入庫，確保效度並降低新進師資撰寫負擔。`},
{id:'B7',cat:'B',star:0,must:0,owners:['張毓倫','蘇欣怡'],src:'成果報告書參一、參六；準備計畫書陸Q16',
q:'學員如何安排？輪調頻繁的住院醫師與PGY如何涵蓋？',
a:`採常態化每月開課，住院醫師與PGY於輪訓期間均會被排入至少一次原位模擬訓練。對新調進單位的學員，提供TRM教學網站於訓前自主預習，建立Call-Out、Check-Back等共通語彙，降低學習曲線。`,
extra:'學員排入機制與排班、教學時數整合之細節口徑。'},
{id:'B8',cat:'B',star:1,must:1,owners:['全體'],src:'成果報告書參二、參五、肆三；準備計畫書陸Q17',
q:'快答抽問：GAS三字母各是什麼？T-ACLS五構面？STAR四構念？（全員必背）',
a:`GAS為Gather蒐集反應、Analyze分析表現差距、Summarize摘要關鍵學習點。T-ACLS五構面源自TeamSTEPPS：團隊結構、情境監控、溝通、領導力、互助支持，另加整體合作表現Global題，共22題。STAR-Resus四構念：Time時間、Quality品質、Technical技術執行、Process流程整合。`},
{id:'B9',cat:'B',star:1,must:0,owners:['黃沛銓','張毓倫'],src:'準備計畫書貳三、陸Q18',
q:'書面資料與現場說法若有出入怎麼辦？報告書有無需要勘誤之處？',
a:`主動準備、誠信面對。附件九獎項一覽與正文兩處之獎牌記載不一致，報告前已完成勘誤並於現場報告資料附勘誤頁；若委員問及，坦承為繕打疏漏並出示獎狀正本。其餘所有數字（43場、220人次、24項LST、25配對統計等）均與報告書一致，簡報製作時逐一核對。`},
{id:'B10',cat:'B',star:0,must:0,owners:['蘇欣怡','陳俊維'],src:'成果報告書參六、肆三；準備計畫書捌第七冊',
q:'訓練錄影的知情同意與個資保護如何處理？',
a:`訓練錄影僅供教學回饋與研究使用，學員於訓前說明中知情同意；檔案於院內加密儲存，ReSim平台設權限管理；用於研究之資料均去識別化，並通過IRB審查（T-ACLS案號202508095RIND）。數位工具開發亦備有資訊安全與個資保護說明文件。`,
extra:'確認院內錄影同意書版本與ReSim帳號權限管理現況，統一口徑。'},
{id:'B11',cat:'B',star:0,must:0,owners:['連君茹','陳勤策'],src:'成果報告書參二、參四、肆五；準備計畫書陸Q33',
q:'若學員在模擬中犯下嚴重錯誤，師資如何處理？',
a:`課前宣讀心理安全聲明，明示錯誤是學習素材而非評判依據；演練中師資僅於立即安全疑慮時介入；匯報時聚焦行為與系統因素而非個人，以GAS結構引導學員自行發現差距；必要時課後個別輔導。學員心得中「在模擬中犯錯感到安全」正是此機制的佐證。`},
{id:'B12',cat:'B',star:0,must:0,owners:['張毓倫','連君茹'],src:'成果報告書參三、參四、肆一',
q:'43場220人次，平均每場約5名學員，師生比與觀察品質如何？',
a:`小班設計是刻意的。原位模擬在真實單位進行，每場以值班團隊規模為上限；每場配置雙師資，一人主導情境與匯報、一人專責觀察與評量，搭配急救面板與APP分擔計時記錄，確保每位學員的行為都被看見與回饋。`},
{id:'B13',cat:'B',star:0,must:0,owners:['蘇欣怡','張毓倫'],src:'成果報告書參二、參四、肆四',
q:'60分鐘訓練如何嵌入忙碌的臨床排班？單位配合意願如何維持？',
a:`課程長度60分鐘本身就是配合臨床的設計，含課前準備、情境、匯報與精熟練習各段壓縮至單位可承受的離線時間；訓前24小時場地評估與護理長協調機制，避開單位高峰時段；訓練直接產出與該單位相關的LST改善，讓單位看見自身受益，配合意願由被動轉為主動。`},
{id:'B14',cat:'B',star:0,must:0,owners:['陳俊維'],src:'成果報告書參五、肆三；準備計畫書陸Q23',
q:'不同評分者之間的一致性如何維持？',
a:`15位評分者均具ALS認證並接受統一評分訓練；每場採雙評分者設計；STAR時間類指標由急救APP客觀產出，減少主觀判斷；T-ACLS與國際TEAM量表的聚合效度達0.84至0.89，顯示評分趨勢一致；評分者間信度ICC(2,k)驗證進行中，完成後會補強最後一塊證據。`},
{id:'B15',cat:'B',star:0,must:0,owners:['連君茹','蘇欣怡'],src:'成果報告書參四；準備計畫書陸Q12',
q:'訓練用物與臨床用物如何區隔？會動用到真實藥物嗎？',
a:`訓練用物與臨床用物明確區隔，另備訓練專用耗材與備用急救箱；不使用臨床現用藥物，模擬用藥以訓練耗材替代；訓練結束後場地復原並點交，確保臨床急救系統隨時處於備戰狀態。`,
extra:'依SOP確認用物區隔與點交細節口徑。'},

/* ── Ｃ、成果表現：量化證據與方法學 ── */
{id:'C1',cat:'C',star:1,must:0,owners:['陳俊維'],src:'成果報告書肆三、伍二；準備計畫書陸Q19',
q:'25組配對樣本會不會太小？d_z=2.32的效果量大得不尋常，如何解釋？',
a:`承認這是導入新量表初期的驗證規模；但配對設計下統計證據內部一致：Wilcoxon檢定p<0.0001、25組全數進步、21個單項經Holm-Bonferroni校正後均達顯著。效果量大反映的是「單場GAS匯報後立即重測」的近端教學效應，我們不將其解讀為長期保留效果；長期保留與盲評驗證已列為下一步。同時有TEAM三年縱貫趨勢與質性心得軌跡交叉支持，非單一證據源。`},
{id:'C2',cat:'C',star:1,must:0,owners:['陳俊維'],src:'成果報告書肆五、伍二；準備計畫書陸Q20',
q:'同一情境練第二次的進步，會不會只是練習效應，而非匯報的效果？',
a:`三層回答。第一，承認無法完全排除練習效應，報告書已明載此限制。第二，反證：若僅是重複練習，難以解釋Call-Out、Two-Challenge、Huddle啟動等非技術行為的結構性出現，此類行為通常需在匯報中被具體點出才會改變，且學員心得的行為語言同步改變。第三，下一步：規劃納入「重複演練但無結構化匯報」的比較設計與盲評驗證。`},
{id:'C3',cat:'C',star:0,must:0,owners:['陳俊維'],src:'成果報告書參五、伍二；準備計畫書陸Q21',
q:'為什麼沒有對照組？',
a:`基於教育倫理與臨床可行性。結構化匯報的效益已有國際實證，ILCOR 2025年亦建議將原位模擬納入CPR訓練選項，對第一線值班同仁設置「不給匯報」的對照組有教育倫理疑慮。本案採自身配對設計使每團隊自為對照，並以TEAM縱貫、質性心得、真實場域資料（JAHA論文）多源三角驗證；2027年多中心驗證將提供跨機構比較基礎。`},
{id:'C4',cat:'C',star:1,must:0,owners:['陳俊維'],src:'成果報告書肆二、肆五；準備計畫書陸Q22',
q:'TEAM三年縱貫資料是不同團隊、不同學員，怎能說是進步？',
a:`精確定位評估維度。TEAM縱貫呈現的是系統層級的團隊表現趨勢，反映訓練體系整體成熟度與共通語彙建立，而非同一學員的個人成長曲線；我們刻意區分這兩層，避免生態謬誤。個人層級證據來自T-ACLS配對資料、模組勝任標準（STAR達4分）與質性心得軌跡，三者互為補充。`},
{id:'C5',cat:'C',star:1,must:0,owners:['陳俊維'],src:'成果報告書參五、肆三；準備計畫書陸Q23',
q:'T-ACLS的ICC還在驗證中，現在的分數可信嗎？',
a:`已完成的心理計量證據包括內容效度（I-CVI與S-CVI達標）、內部一致性Cronbach's α=0.978、反應性（總分d_z=2.32）、與國際TEAM量表的聚合效度（總分Spearman ρ=0.84至0.89，Bland-Altman分析無系統性偏差）。ICC絕對一致性驗證進行中；過渡期以15位ALS認證評分者、統一評分訓練與雙評分者設計控制信度風險，時間類硬性指標由急救APP客觀產出。`},
{id:'C6',cat:'C',star:1,must:0,owners:['陳俊維','連君茹'],src:'成果報告書參五、肆三；準備計畫書陸Q24',
q:'STAR-Resus沒有送IRB，資料可以用來評量學員或發表嗎？',
a:`區分用途回答。STAR目前定位為常規教學品質監測與即時回饋工具，屬臨床教育常規活動，資料去識別化管理，不屬人體研究範疇；涉及研究產出的T-ACLS已通過IRB審查。STAR後續若要進行系統性信效度研究與學術發表，會在投稿前完成人體試驗委員會送審或豁免程序。`,
extra:'先與IRB確認STAR信效度研究的送審或豁免路徑，全員統一口徑。'},
{id:'C7',cat:'C',star:1,must:0,owners:['陳勤策'],src:'成果報告書肆六；準備計畫書陸Q25',
q:'幸福感問卷N=44、單次橫斷面，工具從哪來？能歸因於本計畫嗎？',
a:`據實說明。2024年5至7月以5點李克特量表六題工作幸福感題組，對參與原位模擬訓練的急救相關職類同仁施測，回收有效樣本44份，六題平均4.30至4.41，「尚可以上」比例均達97.7%以上。定位為組織氛圍的正向水準描述，不做因果宣稱；與質性心得中反覆出現的認可感、安全感主題相互呼應。`,
extra:'備妥原始問卷與施測說明，確認題組出處與施測脈絡；若題組源自其他調查之一部分，應如實說明，口徑與原始資料完全一致，此題失分風險在於說法前後不一。'},
{id:'C8',cat:'C',star:0,must:0,owners:['張毓倫','連君茹'],src:'成果報告書肆四、附件四；準備計畫書陸Q26',
q:'24項LST只完成12項改善（50%），其餘為何未完成？',
a:`LST改善常涉及跨部門協調與資源配置。已完成的12項均屬高風險且可即時介入者，例如喉鏡電力確認納入急救車每班稽核、兒科藥物劑量建置於急救APP自動計算。其餘項目如TCP決策樹、院內外場域急救動線圖更新，因涉及院級空間調整與跨科部共識，目前標示「進行中」，均登錄於追蹤系統並有主責人。識別、通報、追蹤、稽核的完整閉環，正是本案對病安體系的制度貢獻。`,
extra:'進行中項目之現況與預定時程一覽表。'},
{id:'C9',cat:'C',star:0,must:0,owners:['連君茹','張毓倫'],src:'成果報告書肆四；準備計畫書陸Q27',
q:'改善後有無再驗證？如何確認問題未再發生？',
a:`兩軌再驗證。第一軌，改善措施併入日常臨床稽核，如114年急救流程稽核表定期監測合規率。第二軌，原位模擬本身即為再驗證機制，後續在相同單位的演練場次中，同類LST若再現會被系統重新標記並啟動檢討，直到完全排除。`,
extra:'若有稽核合格率或未再發生之紀錄，請備妥數據。'},
{id:'C10',cat:'C',star:0,must:0,owners:['蘇欣怡','范凱淇'],src:'成果報告書參五、參六；準備計畫書陸Q28',
q:'單場訓練同時使用三個量表，觀察教師負荷會不會太重？',
a:`並非每場全上。依訓練模組與對象分流，例如基礎技術模組以STAR為主，跨職類資深團隊模組以T-ACLS與TEAM為主；每場雙師資中由輔助師資專責量表填寫；急救面板卸除計時監控、急救APP自動產出時間資料，使觀察人力聚焦於行為觀察本身，這正是數位工具改善教師負荷的直接體現。`},
{id:'C11',cat:'C',star:0,must:0,owners:['陳俊維'],src:'成果報告書肆二、肆三、參五',
q:'TEAM總分28.84進步至38.00，代表什麼意義？有無天花板效應？',
a:`此為25組配對前後測結果，效果量d_z=1.72，顯示單場訓練對團隊表現有明確的近端效益；三年縱貫資料亦呈現上升趨勢，反映體系成熟。後期場次平均分雖已偏高，但個別構面如溝通與領導力仍有進步空間，因此我們進階開發T-ACLS做更細緻的非技術技能評量，避免單一工具的天花板限制。`},
{id:'C12',cat:'C',star:0,must:0,owners:['陳勤策'],src:'成果報告書肆五；準備計畫書陸',
q:'質性心得是如何分析的？分析的可信度如何確保？',
a:`學員心得依年度彙整，歸納主題後呈現三階段軌跡：早期聚焦技術操作層次的反思，中期出現TRM系統性反思，近期進展至臨床應用與深層概念化；報告書以學員原文摘錄佐證各階段，並與量化結果、LST改善相互三角驗證。`,
extra:'編碼者人數、共識程序等分析細節口徑，若委員深問可如實說明。'},
{id:'C13',cat:'C',star:0,must:0,owners:['張毓倫','連君茹'],src:'成果報告書參三、參四、肆四、附件七；附件1-9成果表現第5項',
q:'制度化構面問「制度與標準的改變及新版落實程度」，具體例子是什麼？',
a:`四個實例。原位模擬SOP有歷次修訂版本可查，顯示制度隨執行回饋更新；場地安全評估表由無到有並正式納入訓練流程；LST改善項併入114年急救流程稽核表，成為常規監測；TTT辦法與3年再認證機制正式實施，13名師資完成認證。新版制度的落實以簽到紀錄、稽核表與認證紀錄佐證。`},
{id:'C14',cat:'C',star:0,must:0,owners:['黃沛銓','陳俊維'],src:'成果報告書肆、伍一；附件1-9成果表現第1、3項',
q:'「簡化、優化之綜效」與「整體成效之突破性」體現在哪裡？',
a:`綜效在於一場訓練雙重產出：教學端提升團隊表現（25組全數進步），病安端同時識別24項LST並完成12項改善，訓練與安全查核不必分開辦理。突破性在於把原位模擬、結構化反思、本土化雙量表與自製數位工具整合為可複製的學習系統，並以雙國際期刊驗證，而非單點式的教學活動。`},
{id:'C15',cat:'C',star:0,must:0,owners:['黃沛銓','陳俊維'],src:'成果報告書肆七、參六；準備計畫書陸Q35',
q:'學術發表與教學成效之間的連結是什麼？',
a:`研究問題都來自教學現場。Medical Teacher論文比較現場與影片評量的一致性，直接決定了ReSim平台定位為形成性回饋工具；JAHA論文以真實急救資料驗證非技術技能與CPR品質的關聯，回過頭強化課程對領導力與溝通行為的教學重點。教學產生問題、研究回答問題、答案回到課程，形成完整循環。`},

/* ── Ｄ、檢討與未來 ── */
{id:'D1',cat:'D',star:1,must:0,owners:['黃沛銓','陳俊維'],src:'成果報告書伍二；準備計畫書陸Q32',
q:'你們自己認為本案最大的弱點是什麼？',
a:`主動、具體、有對策，共三點。第一，成效證據集中於近端學習成果，病人層級成效與長期保留尚待建立，對策為2026至2028長期追蹤與多中心驗證。第二，自製量表心理計量驗證未全部完成，ICC與因素分析進行中，對策為擴大樣本與盲評設計。第三，跨職類涵蓋率與病房推廣仍有空間，對策為病房試點與跨機構聯合訓練。誠實的自我檢討正是檢討構面的得分點，切勿回答沒有弱點。`},
{id:'D2',cat:'D',star:0,must:0,owners:['陳勤策','蘇欣怡'],src:'成果報告書參二、參六；準備計畫書陸Q33',
q:'設計思考與使用者經驗設計如何體現？',
a:`每項工具都由使用者痛點驅動。引導師「監控者與觀察者角色衝突」的痛點，催生自動計時的急救面板；記錄與記憶負荷，催生自動產出時序log的急救APP；學員預習與共通語彙不足，催生TRM教學網站；回饋受限於在場、即時、單次，催生支援時間軸標記的ReSim回饋網站；學員怕被評判，於課前宣讀心理安全聲明。課程本身亦經「蒐集學員回饋與師資反思日誌、課程迭代」持續改版。`},
{id:'D3',cat:'D',star:0,must:0,owners:['連君茹','陳俊維'],src:'成果報告書伍二、伍四；準備計畫書陸',
q:'如果重新開始，你們會改變什麼？',
a:`三件事會更早做。第一，在導入初期即設計比較性研究架構與盲評機制，讓匯報效益的因果證據更完整；第二，STAR量表的倫理審查文件與信效度研究會更早啟動；第三，教師工作負荷的量化指標會從第一年即開始系統性記錄，而非僅以機制與質性證據呈現。這些均已納入未來三年行動計畫。`},
{id:'D4',cat:'D',star:0,must:0,owners:['黃沛銓','張毓倫'],src:'成果報告書伍四、肆四；準備計畫書陸Q34',
q:'未來三年最重要的目標是什麼？目前未解問題的進度？',
a:`依2026至2028路線圖：2026年啟動跨機構聯合訓練與病房快速反應小組試點；2027年進行STAR與T-ACLS多中心信效度驗證，完成ICC與因素分析；2028年建立長期行為保留與病人層級成效追蹤。未解問題如12項進行中LST，均有主責人與追蹤時程，按季檢討。`},

/* ── Ｅ、加分項與學術 ── */
{id:'E1',cat:'E',star:0,must:0,owners:['張毓倫','連君茹'],src:'成果報告書肆七、伍四；準備計畫書陸Q34',
q:'區域性合作的具體內容與進度？',
a:`已有跨機構交流實績。2024年2月赴台北榮總進行雙向學術分享並獲回饋，2024年9月接待北榮團隊來訪實地交流。規劃面：與鄰近教學醫院共享師資、情境腳本庫與LST改善資料庫，鄰近醫院已表達合作意願；2026年啟動跨機構聯合訓練，2027年進行多中心驗證。`,
extra:'合作院名、公文或會議紀錄，列入造冊第八冊；有簽署文件者優先出示。'},
{id:'E2',cat:'E',star:0,must:0,owners:['陳俊維'],src:'成果報告書肆七；準備計畫書陸Q35',
q:'Medical Teacher論文指出現場與影片評量一致性僅屬中等，影片評量真的可行？AMEE 2026的LLM評分者定位為何？',
a:`論文結論的精確版本是：兩種評量模式於群體層級的一致性可接受（ICC 0.59至0.75，Bland-Altman無比例性偏差），且一致性受評分者經驗影響；因此影片評量適用於群體層級的教學品質監測與形成性回饋，高利害的個人評核仍以現場評分為主。LLM定位為第二評分者的探索性研究，輔助人類評分者、提供一致性參考，而非取代。`},
{id:'E3',cat:'E',star:0,must:0,owners:['連君茹','張毓倫'],src:'成果報告書參三、伍三、伍四；附件1-9加分項第1款',
q:'加分項問「可跨團隊或跨領域使用」，實績是什麼？',
a:`三個層次。職類面：師資庫已納入加護病房、產房與護理部種子教師，情境涵蓋成人、兒科與產科急救。單位面：啟動一般病房快速反應小組試點推廣，將SOP與數位工具複製至試點單位。機構面：與鄰近醫院共享腳本庫與改善資料庫，規劃聯合培育。模式本身不依賴特定科別，核心是可移植的流程與工具。`},
{id:'E4',cat:'E',star:0,must:0,owners:['陳俊維','黃沛銓'],src:'成果報告書肆七；準備計畫書陸Q35',
q:'本案是否使用人工智慧工具？如何定位與治理？',
a:`目前探索性應用於評量研究，AMEE 2026發表的LLM第二評分者研究，定位為輔助人類評分者、提供一致性參考；涉及錄影與學員資料之處理，均依IRB審查與院內資安規範執行。若委員問及競賽文件是否使用AI輔助，如實說明使用範圍與用途，所有數據內容均由團隊核實。`},

async function toggleItem(id){ const cur=S.items&&S.items[id]&&S.items[id].d; await saveState({items:{[id]:{d:cur?0:1,by:ME||'訪客',at:Date.now()}}}); }
function itemOn(id){ return !!(S.items&&S.items[id]&&S.items[id].d); }
function itemMeta(id){ const it=S.items&&S.items[id]; if(!it||!it.d) return ''; return `<span class="ck-meta">✓ ${esc(it.by||'')}・${fmtT(it.at)}</span>`; }
function ckHtml(id,text,extra=''){ const on=itemOn(id); return `<li><button class="ckbox ${on?'on':''}" data-ck="${id}">${on?'✓':''}</button><div style="flex:1"><span class="${on?'ck-done':''}">${text}</span>${extra}${itemMeta(id)}</div></li>`; }

/* ═══════════ 倒數計時 ═══════════ */
function tick(){
  const now=Date.now();
  const diff=REPORT_AT-now;
  const past=diff<0;
  const ad=Math.abs(diff);
  const d=Math.floor(ad/86400e3), h=Math.floor(ad%86400e3/3600e3), m=Math.floor(ad%3600e3/60e3), s=Math.floor(ad%60e3/1e3);
  $('hdCount').innerHTML=past?'🏆 已完賽':`<b>D-${d}</b> ${pad(h)}:${pad(m)}:${pad(s)}<br>8/17 15:30 進場`;
  const el=$('cdDays');
  if(el){
    el.innerHTML=past?'完賽！':`${d}<small> 天</small>`;
    $('cdHms').textContent=past?'辛苦了，等待佳音 🙏':`${pad(h)} 時 ${pad(m)} 分 ${pad(s)} 秒`;
  }
}

/* ═══════════ 分工 ═══════════ */
function noteKey(member,key){ return `${member}__${key}`; }
function noteEditor(member,key,label){
  const k=noteKey(member,key); const n=NOTES[k];
  const mine=(ME===member);
  const others=MNAMES.filter(x=>x!==member).map(x=>NOTES[noteKey(x,key)]).filter(x=>x&&x.text);
  let h='';
  if(mine){
    h+=`<textarea data-notekey="${k}" placeholder="${esc(label)}">${esc(n&&n.text||'')}</textarea>
    <div style="display:flex;align-items:center;gap:8px;margin-top:5px">
      <button class="btn sm" data-notesave="${k}">💾 儲存筆記</button>
      <span class="note-meta" data-notemeta="${k}">${n&&n.up?('上次儲存 '+fmtT(n.up)):''}</span></div>`;
  }else if(n&&n.text){
    h+=`<div style="background:#f8fafc;border:1px dashed var(--line);border-radius:9px;padding:8px 11px;font-size:13.5px;white-space:pre-wrap">${esc(n.text)}</div><div class="note-meta">${esc(member)}的筆記・${fmtT(n.up)}</div>`;
  }else{
    h+=`<div class="note-meta">（${esc(member)}尚未留筆記）</div>`;
  }
  return h;
}
function withNotePreserve(fn){
  // 重新渲染前保住「打到一半、尚未儲存」的筆記
  const dirty={};
  document.querySelectorAll('[data-notekey]').forEach(ta=>{ if(ta.dataset.dirty==='1')dirty[ta.dataset.notekey]=ta.value; });
  const focusKey=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.notekey;
  fn();
  Object.entries(dirty).forEach(([k,v])=>{
    const ta=document.querySelector(`[data-notekey="${k}"]`);
    if(ta){ ta.value=v; ta.dataset.dirty='1'; }
  });
  if(focusKey){ const ta=document.querySelector(`[data-notekey="${focusKey}"]`); ta&&ta.focus(); }
}

/* ═══════════ 題庫／閃卡 ═══════════ */
let F={cat:'all',owner:'all',star:false,must:false,weak:false,search:''};
function deckFilter(){
  let list=[];
  QUESTIONS.forEach(q=>{
    if(F.cat!=='all'&&F.cat!=='M'&&q.cat!==F.cat)return;
    if(F.cat==='M')return;
    if(F.owner!=='all'&&!(q.owners.includes(F.owner)||q.owners.includes('全體')))return;
    if(F.star&&!q.star)return;
    if(F.must&&!q.must)return;
    if(F.weak){ const lv=(CARDS[ME]||{})[q.id]||0; if(lv===3)return; }
    if(F.search){ const s=F.search.toLowerCase(); if(!(q.q+q.a+(q.extra||'')+q.id).toLowerCase().includes(s))return; }
    list.push({type:'q',...q});
  });
  if((F.cat==='all'||F.cat==='M')&&F.owner==='all'&&!F.star){
    MUSTCARDS.forEach((c,i)=>{
      const id='M'+i;
      if(F.weak){ const lv=(CARDS[ME]||{})[id]||0; if(lv===3)return; }
      if(F.search&&!((c.g+c.q+c.a).toLowerCase().includes(F.search.toLowerCase())))return;
      list.push({type:'m',id,cat:'M',q:c.q,a:c.a,g:c.g,owners:['全體'],star:0,must:1,src:'附錄必背卡'});
    });
  }
  return list;
}
function myLv(id){ return (CARDS[ME]||{})[id]||0; }

function watchLines(mid){
  if(watchedMid===mid&&linesUnsub)return;
  if(linesUnsub){ linesUnsub(); linesUnsub=null; }
  watchedMid=mid; LINES=[];

  linesUnsub=onSnapshot(query(collection(db,'ncmea_meet_lines'),where('mid','==',mid)),s=>{
    LINES=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>{
      const am=a.at&&a.at.toMillis?a.at.toMillis():9e15, bm=b.at&&b.at.toMillis?b.at.toMillis():9e15;
      return am-bm;
    });

  const sys=`你是「NCMEA 備戰中心」的會議記錄祕書。團隊是新竹臺大分院急診醫學部 7 人（黃沛銓副主任、陳俊維醫師、連君茹醫師、張毓倫專科護理師、蘇欣怡護理師、陳勤策護理師、范凱淇護理師），正在準備 115/8/17 NCMEA 國家臨床醫學教育獎第二階段現場報告（12分鐘簡報＋30分鐘答詢＋3分鐘補充）。請把逐字稿整理成繁體中文會議記錄，格式：

## 決議事項
（條列；沒有就寫「無」）
## 待辦事項
（條列，格式：事項｜負責人｜期限；負責人盡量對應7位成員）
## 待確認與風險

逐字稿來自語音辨識可能有錯字，請依上下文合理還原。只輸出會議記錄本身。`;

function mdToHtml(md){
  const lines=String(md||'').split('\n'); let html='',inUl=false;
  const closeUl=()=>{ if(inUl){ html+='</ul>'; inUl=false; } };
  lines.forEach(l=>{
    let t=esc(l.trim());
    t=t.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
    if(/^#{2,4}\s/.test(l.trim())){ closeUl(); html+=`<h4>${t.replace(/^#+\s*/,'')}</h4>`; }
    else if(/^[-*]\s/.test(l.trim())){ if(!inUl){ html+='<ul>'; inUl=true; } html+=`<li>${t.replace(/^[-*]\s*(\[[ x]\]\s*)?/,'')}</li>`; }
    else if(t){ closeUl(); html+=`<div style="margin:3px 0">${t}</div>`; }
  });
  closeUl(); return html;
}
function startRec(){
  const live=liveMeeting();
  if(!live||watchedMid!==live.id){ toast('請先開始或加入進行中的會議'); return; }
  if(!canWrite())return;
  if(!SR){ toast('此瀏覽器不支援語音辨識，請改用電腦版 Chrome／Edge，或用下方手動補充'); return; }
  rec=new SR(); rec.lang='zh-TW'; rec.continuous=true; rec.interimResults=true;
  rec.onresult=e=>{
    let fin=''; interimTxt='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];
      if(r.isFinal)fin+=r[0].transcript; else interimTxt+=r[0].transcript;
    }
    if(fin.trim())pushLine(fin.trim());
    renderLines();
  };
  rec.onend=()=>{ if(recOn){ try{rec.start();}catch(e){} } };
  rec.onerror=ev=>{ if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){ recOn=false; toast('無法取得麥克風權限'); updRecBtn(); } };
  try{ rec.start(); recOn=true; }catch(e){ toast('啟動失敗：'+e.message); }
  updRecBtn();
}

  q1('btnSum')&&(q1('btnSum').onclick=()=>summarize(watchedMid));
  q1('btnMan')&&(q1('btnMan').onclick=()=>{ const i=$('manLine'); if(i.value.trim()){ pushLine(i.value.trim()); i.value=''; } });
  q1('manLine')&&q1('manLine').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.isComposing)q1('btnMan').click(); });
  $('tab-meet').querySelectorAll('[data-watch]').forEach(b=>b.onclick=()=>watchLines(b.dataset.watch));
  updRecBtn(); renderLines(); renderMeetMinutes();
}
function renderMeetMinutes(){
  const w=watchedMeeting(); const card=$('minutesCard'); if(!card)return;
  if(w&&w.minutes){
    card.style.display='block';
    $('minutesBody').innerHTML=mdToHtml(w.minutes);
    $('btnCopyMin').onclick=()=>{ navigator.clipboard.writeText(w.minutes).then(()=>toast('已複製')); };
    $('btnDlMin').onclick=()=>download(`會議記錄_${w.title}.md`,`# ${w.title}（${fmtT(w.startedAt)}）\n\n${w.minutes}`,'text/markdown');
  }else card.style.display='none';
}

  $('expAll').onclick=()=>download(`NCMEA全隊手冊_2026H2023.html`,packHtml(null,{ans:true,notes:true,must:true,min:true}),'text/html');

function memberQs(name){ const m=MEMBERS.find(x=>x.name===name); return QUESTIONS.filter(q=>(m&&m.qids.includes(q.id))||q.owners.includes('全體')); }
function latestMinutes(){ return MEETS.filter(m=>m.minutes).sort((a,b)=>(b.minutesAt||0)-(a.minutesAt||0))[0]; }
function packBody(name,opt){
  const forAll=!name;
  const m=MEMBERS.find(x=>x.name===name);
  const qs=forAll?QUESTIONS:memberQs(name);
  const noteOf=k=>{ const n=NOTES[noteKey(name,k)]; return n&&n.text?n.text:''; };
  let h=`<h2 style="margin:0">⚕️ NCMEA 現場報告攜帶包${forAll?'（全隊完整版）':'—'+esc(name)}</h2>
  <div style="color:#667;font-size:13px">2026H2023・新竹臺大分院急診醫學部・產生於 ${fmtT(Date.now())}</div>
  <div style="background:#0f2b46;color:#fff;border-radius:12px;padding:12px 15px;margin:12px 0">
    <b>🗓 115/8/17（一）</b>　13:00 前抵達報到・15:00 集合・<b style="color:#fbbf24">15:30–16:15 進場面談</b><br>
    <small>新北市板橋區三民路二段37號9樓（901/902 出發前確認）・大會窗口 余佳純 02-8964-3000#3385・當日 0911-998-874</small>
  </div>`;
  if(m){
    h+=`<h3 style="border-left:4px solid ${m.color};padding-left:8px">👤 我的任務</h3>
    <div><b>${esc(m.name)}</b>（${esc(m.title)}）｜${esc(m.role)}</div>
    <div style="margin:4px 0"><b>主答領域：</b>${esc(m.duty)}</div>
    <div style="margin:4px 0"><b>佐證主責：</b>${esc(m.docs)}</div>
    <div style="margin:4px 0"><b>一句話任務（F3必背）：</b>「${esc(m.one)}」</div>
    ${opt.notes&&noteOf('role')?`<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:9px;padding:8px 11px;margin-top:6px"><b>📝 我的工作筆記：</b><br><span style="white-space:pre-wrap">${esc(noteOf('role'))}</span></div>`:''}`;
  }
  h+=`<h3>🕐 面談結構與答詢通則</h3>
  <div>12分鐘重點介紹（目標11′30″）→ 30分鐘答詢 → 3分鐘補充（A/B案）</div>
  <ul>${QA_RULES.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>
  <h3>✅ 我的時程任務</h3>
  <ul>${TIMELINE.flatMap(p=>p.tasks).filter(t=>forAll||t.o==='全體'||t.o.includes(name)).map(t=>`<li>${itemOn(t.id)?'☑':'☐'} ${esc(t.t)}（${esc(t.o)}）</li>`).join('')}</ul>
  <h3>🧳 攜帶清單（8/16 晚間勾核）</h3>
  <ul>${CARRY.map(c=>`<li>${itemOn(c.id)?'☑':'☐'} ${esc(c.t)}</li>`).join('')}</ul>
  <h3>🎯 ${forAll?'全部詢答題庫（55題）':'我的主答題（'+qs.length+'題，含全員必背）'}</h3>`;
  let lastCat='';
  qs.forEach(q=>{
    if(q.cat!==lastCat){ lastCat=q.cat; h+=`<h4 style="background:#eef2f7;padding:5px 9px;border-radius:7px">${q.cat}・${CATS[q.cat]}</h4>`; }
    const note=!forAll&&opt.notes?noteOf('q_'+q.id):'';
    h+=`<div style="border:1px solid #e3e9f0;border-radius:10px;padding:10px 12px;margin-bottom:9px;page-break-inside:avoid">
      <b>${q.id}${q.star?'★':''}${q.must?'（全員必背）':''}　${esc(q.q)}</b>
      ${opt.ans?`<div style="margin-top:6px;white-space:pre-wrap">${esc(q.a)}</div>`:''}
      ${q.extra?`<div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:6px 9px;margin-top:6px;font-size:13px">⚠️ 請團隊補充：${esc(q.extra)}</div>`:''}
      <div style="font-size:12px;color:#889;margin-top:5px">主答：${(q.owners||[]).join('、')}｜出處：${esc(q.src||'')}</div>
      ${note?`<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:6px 9px;margin-top:6px;font-size:13.5px"><b>📝 我的筆記：</b><span style="white-space:pre-wrap">${esc(note)}</span></div>`:''}
    </div>`;
  });
  if(opt.must){
    h+=`<h3>📍 全體必背卡</h3>`;
    let lg='';
    MUSTCARDS.forEach(c=>{
      if(c.g!==lg){ lg=c.g; h+=`<h4 style="background:#fef3c7;padding:5px 9px;border-radius:7px">${esc(c.g)}</h4>`; }
      h+=`<div style="margin-bottom:6px"><b>Q：${esc(c.q)}</b><br>A：${esc(c.a)}</div>`;
    });
  }
  if(opt.min){
    const lm=latestMinutes();
    if(lm)h+=`<h3>📋 最新會議記錄：${esc(lm.title)}（${fmtT(lm.startedAt)}）</h3><div style="border:1px solid #e3e9f0;border-radius:10px;padding:10px 13px">${mdToHtml(lm.minutes)}</div>`;
  }
  h+=`<div style="margin-top:16px;color:#99a;font-size:12px">— NCMEA 備戰中心・轉化臨床危機為教學契機 —</div>`;
  return h;
}
function packHtml(name,opt){
  return `<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NCMEA攜帶包${name?'_'+name:'_全隊'}</title>
<style>body{font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;max-width:760px;margin:0 auto;padding:16px;line-height:1.7;color:#1e2a38;font-size:15.5px}h3{border-bottom:2px solid #0f2b46;padding-bottom:4px;margin-top:22px}ul{padding-left:22px}@media print{body{font-size:12.5px}}</style>
</head><body>${packBody(name,opt)}</body></html>`;
}
function packMd(name,opt){
  const m=MEMBERS.find(x=>x.name===name);
  const qs=memberQs(name);
  const noteOf=k=>{ const n=NOTES[noteKey(name,k)]; return n&&n.text?n.text:''; };
  let s=`# NCMEA 現場報告攜帶包 — ${name}\n2026H2023・產生於 ${fmtT(Date.now())}\n\n`;
  s+=`## 🗓 決戰日 115/8/17（一）\n- 13:00 前抵達報到（板橋三民路二段37號9樓，901/902出發前確認）\n- 15:00 集合｜**15:30–16:15 進場面談**\n- 大會窗口：余佳純 02-8964-3000#3385｜當日 0911-998-874\n\n`;
  if(m)s+=`## 👤 我的任務\n- **${m.name}**（${m.title}）｜${m.role}\n- 主答領域：${m.duty}\n- 佐證主責：${m.docs}\n- 一句話任務：「${m.one}」\n${opt.notes&&noteOf('role')?'- 📝 我的筆記：'+noteOf('role').replace(/\n/g,' ')+'\n':''}\n`;
  s+=`## ✅ 我的時程任務\n${TIMELINE.flatMap(p=>p.tasks).filter(t=>t.o==='全體'||t.o.includes(name)).map(t=>`- [${itemOn(t.id)?'x':' '}] ${t.t}（${t.o}）`).join('\n')}\n\n`;
  s+=`## 🧳 攜帶清單\n${CARRY.map(c=>`- [${itemOn(c.id)?'x':' '}] ${c.t}`).join('\n')}\n\n`;
  s+=`## 🎯 我的主答題（${qs.length}題）\n\n`;
  qs.forEach(q=>{
    s+=`### ${q.id}${q.star?'★':''} ${q.q}\n`;
    if(opt.ans)s+=`${q.a}\n`;
    if(q.extra)s+=`> ⚠️ 請團隊補充：${q.extra}\n`;
    const note=opt.notes?noteOf('q_'+q.id):'';
    if(note)s+=`> 📝 我的筆記：${note.replace(/\n/g,' ')}\n`;
    s+=`（主答：${(q.owners||[]).join('、')}）\n\n`;
  });
  if(opt.must){ s+=`## 📍 全體必背卡\n`; MUSTCARDS.forEach(c=>{ s+=`- **${c.q}** ${c.a}\n`; }); }
  if(opt.min){ const lm=latestMinutes(); if(lm)s+=`\n## 📋 最新會議記錄：${lm.title}\n${lm.minutes}\n`; }
  return s;
}
function download(fn,content,mime){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['﻿'+content],{type:mime+';charset=utf-8'}));
  a.download=fn; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

/* ═══════════ 共用綁定與分頁 ═══════════ */
function bindCommon(root){
  root.querySelectorAll('[data-ck]').forEach(b=>b.onclick=()=>toggleItem(b.dataset.ck));
  root.querySelectorAll('[data-goq]').forEach(b=>b.onclick=()=>goQuestion(b.dataset.goq));
  root.querySelectorAll('[data-drill]').forEach(b=>b.onclick=()=>{
    const m=MEMBERS.find(x=>x.name===b.dataset.drill);
    const deck=QUESTIONS.filter(q=>m.qids.includes(q.id)||q.owners.includes('全體')).map(q=>({type:'q',...q}));
    startFc(deck,`${m.name} 的主答題`);
  });
  root.querySelectorAll('[data-notesave]').forEach(b=>b.onclick=async()=>{
    if(!canWrite())return;
    const k=b.dataset.notesave;
    const ta=root.querySelector(`[data-notekey="${k}"]`);
    const [member,...rest]=k.split('__');
    try{
      await setDoc(doc(db,'ncmea_notes',k),{member,key:rest.join('__'),text:ta.value,up:Date.now(),tc:TC});
      delete ta.dataset.dirty; toast('✅ 筆記已儲存並同步');
    }catch(e){ wfail(e); }
  });
  root.querySelectorAll('[data-notekey]').forEach(ta=>ta.addEventListener('input',()=>ta.dataset.dirty='1'));
}
function refreshNoteViews(){
  document.querySelectorAll('[data-notekey]').forEach(ta=>{
    if(ta.dataset.dirty==='1'||document.activeElement===ta)return;
    const n=NOTES[ta.dataset.notekey];
    ta.value=n&&n.text||'';
    const meta=document.querySelector(`[data-notemeta="${ta.dataset.notekey}"]`);
    if(meta&&n&&n.up)meta.textContent='上次儲存 '+fmtT(n.up);
  });
}
let curTab='home';
function switchTab(t){
  curTab=t;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  document.querySelectorAll('.tab').forEach(s=>s.classList.toggle('on',s.id==='tab-'+t));
  if(t==='chat'){ localStorage.setItem('ncmea_chatseen',String(Date.now())); updChatDot(); const box=$('chatBox'); box&&(box.scrollTop=box.scrollHeight); }
}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
function updChatDot(){
  const seen=+(localStorage.getItem('ncmea_chatseen')||0);
  const hasNew=CHATS.some(c=>{ const ms=c.at&&c.at.toMillis?c.at.toMillis():0; return ms>seen&&c.n!==ME; });
  const btn=document.querySelector('#nav button[data-tab=chat] .ic');
  btn.textContent=hasNew&&curTab!=='chat'?'💬🔴':'💬';
}

/* ═══════════ 啟動 ═══════════ */
function boot(){
  booted=true;
  $('meChip').textContent='👤 '+ME;
  renderHomeStatic(); renderHomeDyn(); renderTeam(); renderCardsToolbar(); renderPlan(); renderChat(); renderMeet(); renderExport();
  tick(); setInterval(tick,1000); setInterval(renderHomeDyn,60000);
  onSnapshot(doc(db,'ncmea_state','main'),s=>{
    S=s.exists()?s.data():{items:{}}; S.items=S.items||{};
    renderHomeDyn(); renderTeam(); renderPlan();
    const mu=$('meetUrl'); if(mu&&document.activeElement!==mu)mu.value=S.meetUrl||'';
  },e=>console.warn('state',e));
  onSnapshot(collection(db,'ncmea_notes'),s=>{
    NOTES={}; s.forEach(d=>NOTES[d.id]=d.data());
    refreshNoteViews();
  },e=>console.warn('notes',e));
  onSnapshot(collection(db,'ncmea_cards'),s=>{
    CARDS={}; s.forEach(d=>CARDS[d.id]=(d.data().m||{}));
    renderHomeDyn();
  },e=>console.warn('cards',e));
  onSnapshot(query(collection(db,'ncmea_chat'),orderBy('at','desc'),limit(300)),s=>{
    CHATS=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>{
      const am=a.at&&a.at.toMillis?a.at.toMillis():9e15, bm=b.at&&b.at.toMillis?b.at.toMillis():9e15;
      return am-bm;
    });
    renderChat(); updChatDot();
  },e=>console.warn('chat',e));
  onSnapshot(collection(db,'ncmea_meetings'),s=>{
    MEETS=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.startedAt||0)-(a.startedAt||0));
    const live=liveMeeting();
    if(live&&!watchedMid)watchLines(live.id);
    else renderMeet();
  },e=>console.warn('meet',e));
}
if(ME){ $('meChip').textContent='👤 '+ME; boot(); } else showGate();
