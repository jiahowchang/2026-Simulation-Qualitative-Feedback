<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a5276">
<title>教學歷程 — 張家豪醫師</title>
<meta name="description" content="張家豪醫師（新竹臺大分院急診醫學部）教學歷程公開紀錄：急救復甦、TRM 團隊資源管理、跨專業教育、模擬醫學與災難醫學之授課、進修與教學行政服務。">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy: #1a5276; --navy-d: #123a54; --blue: #2980b9; --blue-l: #ebf5fb;
  --teal: #148f77; --teal-l: #e8f6f3;
  --amber: #b9770e; --amber-l: #fef5e7;
  --rose: #c0392b; --purple: #6c3483; --purple-l: #f4ecf7;
  --ink: #1c2833; --gray: #707b7c; --line: #d5dbdb; --bg: #f4f6f7; --card: #fff;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", Roboto, sans-serif;
  background: var(--bg); color: var(--ink); min-height: 100vh;
}
button { font-family: inherit; }

.topbar { background: var(--navy); color: #fff; padding: 0 20px; display: flex; align-items: center; gap: 14px; height: 56px; position: sticky; top: 0; z-index: 50; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
.topbar h1 { font-size: 1.08rem; font-weight: 800; letter-spacing: .05em; white-space: nowrap; }
.topbar .sub { font-size: .75rem; opacity: .75; white-space: nowrap; }
.layout { display: grid; grid-template-columns: 300px 1fr; gap: 18px; max-width: 1240px; margin: 0 auto; padding: 18px 16px 80px; align-items: start; }
.side { position: sticky; top: 74px; display: flex; flex-direction: column; gap: 14px; }
.panel { background: var(--card); border-radius: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 14px; }
.panel h3 { font-size: .82rem; color: var(--gray); letter-spacing: .08em; margin-bottom: 10px; font-weight: 700; }

/* 個人卡 */
.profile-card { padding: 0; overflow: hidden; }
.profile-card img { display: block; width: 100%; height: 175px; object-fit: cover; object-position: top; }
.profile-card .pc-info { padding: 12px 14px 14px; }
.profile-card .pc-info b { display: block; font-size: 1.05rem; color: var(--navy); margin-bottom: 3px; }
.profile-card .pc-info span { display: block; font-size: .76rem; color: var(--gray); line-height: 1.6; }
.profile-card .pc-info .spec { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: .74rem; }

/* 統計 */
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { background: var(--blue-l); border-radius: 10px; padding: 10px; text-align: center; }
.stat b { display: block; font-size: 1.3rem; color: var(--navy); }
.stat span { font-size: .7rem; color: var(--gray); font-weight: 700; }
.aud-bars { margin-top: 10px; display: flex; flex-direction: column; gap: 5px; }
.aud-bar { display: grid; grid-template-columns: 68px 1fr 30px; gap: 6px; align-items: center; font-size: .72rem; color: var(--gray); }
.aud-bar .bar { height: 8px; border-radius: 4px; background: #e5eaec; overflow: hidden; }
.aud-bar .bar i { display: block; height: 100%; background: var(--teal); border-radius: 4px; }
.aud-bar b { text-align: right; color: var(--ink); }
.learn-line { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: .78rem; color: var(--purple); font-weight: 700; }
.admin-line { margin-top: 4px; font-size: .78rem; color: var(--amber); font-weight: 700; }

/* 主區 */
.main { min-width: 0; }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.toolbar input[type=search] { flex: 1 1 200px; border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 13px; font-size: .92rem; font-family: inherit; outline: none; background: #fff; }
.toolbar input[type=search]:focus { border-color: var(--blue); }
.toolbar select { border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 10px; font-size: .88rem; font-family: inherit; background: #fff; color: var(--ink); outline: none; }

.month-h { font-size: .85rem; font-weight: 800; color: var(--gray); letter-spacing: .06em; margin: 18px 2px 8px; }
.group-h { display: flex; align-items: center; gap: 9px; font-size: 1rem; font-weight: 800; color: var(--navy); margin: 4px 2px 2px; }
.group-h .cnt { font-size: .72rem; font-weight: 700; color: var(--navy); background: var(--blue-l); border-radius: 8px; padding: 2px 9px; }
.group-h.past { color: var(--gray); border-top: 1.5px dashed var(--line); margin-top: 26px; padding-top: 20px; }
.group-h.past .cnt { color: var(--gray); background: #eef2f3; }
.rec { background: var(--card); border-radius: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 14px 16px; margin-bottom: 10px; cursor: pointer; display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center; transition: box-shadow .15s, transform .15s; border-left: 4px solid transparent; }
.rec:hover { box-shadow: 0 4px 14px rgba(26,82,118,.15); transform: translateY(-1px); }
.rec.future { border-left-color: var(--amber); }
.rec.stud { border-left-color: var(--purple); }
.rec.admin { border-left-color: var(--amber); }
.rec .date { text-align: center; }
.rec .date b { display: block; font-size: 1.35rem; color: var(--navy); line-height: 1.1; }
.rec .date span { font-size: .68rem; color: var(--gray); font-weight: 700; }
.rec .body { min-width: 0; }
.rec .title { font-size: 1rem; font-weight: 800; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rec .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: .74rem; color: var(--gray); }
.rec .marks { display: flex; gap: 8px; font-size: .95rem; }
.rec .marks span { opacity: .35; }
.rec .marks span.on { opacity: 1; }
.tag { display: inline-block; border-radius: 7px; padding: 2px 8px; font-size: .72rem; font-weight: 700; }
.tag.cat { background: var(--purple-l); color: var(--purple); }
.tag.aud { background: var(--teal-l); color: var(--teal); }
.tag.method { background: var(--blue-l); color: var(--blue); }
.tag.future-tag { background: var(--amber-l); color: var(--amber); }
.tag.stud { background: var(--purple-l); color: var(--purple); }
.tag.admin { background: var(--amber-l); color: var(--amber); }
.empty { text-align: center; color: var(--gray); padding: 60px 20px; font-size: .95rem; line-height: 2; }
.empty .big { font-size: 3rem; }

/* 詳情頁 */
.detail-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.detail-head h2 { flex: 1; font-size: 1.3rem; color: var(--navy); line-height: 1.4; min-width: 200px; }
.backbtn { border: none; background: #fff; color: var(--navy); border-radius: 10px; padding: 9px 16px; font-size: .88rem; font-weight: 800; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.12); white-space: nowrap; }
.backbtn:hover { background: var(--blue-l); }
.detail-sec { background: var(--card); border-radius: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 16px 18px; margin-bottom: 14px; }
.detail-sec > h3 { font-size: .88rem; color: var(--navy); margin-bottom: 12px; font-weight: 800; letter-spacing: .04em; }
.detail-sec .none { color: #b9c2c6; font-size: .88rem; }
.v-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
.refl-card { background: var(--purple-l); border-radius: 10px; padding: 12px 14px; font-size: .93rem; line-height: 1.8; white-space: pre-wrap; }
.thumb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.thumb-card { display: block; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; text-decoration: none; color: var(--ink); background: #fafbfc; transition: box-shadow .15s, transform .15s; }
.thumb-card:hover { box-shadow: 0 5px 16px rgba(26,82,118,.18); transform: translateY(-2px); }
.tc-preview { height: 160px; background: #eef2f4; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
.tc-preview img { width: 100%; height: 100%; object-fit: cover; }
.tc-preview iframe { width: 100%; height: 100%; border: none; pointer-events: none; background: #fff; }
.tc-preview .bigico { font-size: 3rem; opacity: .55; }
.tc-preview .open-hint { position: absolute; right: 8px; bottom: 8px; background: rgba(26,82,118,.85); color: #fff; font-size: .68rem; font-weight: 700; border-radius: 8px; padding: 3px 8px; }
.tc-name { padding: 9px 12px; font-size: .8rem; font-weight: 700; line-height: 1.45; word-break: break-all; }

.foot-note { max-width: 1240px; margin: 0 auto; padding: 0 16px 40px; font-size: .78rem; color: var(--gray); line-height: 1.8; }
.foot-note b { color: var(--ink); }

@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  .side { position: static; }
  .rec { grid-template-columns: 48px 1fr; }
  .rec .marks { display: none; }
  .topbar .sub { display: none; }
}
</style>
</head>
<body>

<div class="topbar">
  <h1>📚 教學歷程</h1>
  <span class="sub">Teaching Portfolio · 張家豪 醫師</span>
</div>

<div class="layout">
  <div class="side">
    <div class="panel profile-card">
      <img src="profile.jpg" alt="張家豪醫師" loading="lazy">
      <div class="pc-info">
        <b>張家豪 醫師</b>
        <span>Jia How Chang, MD</span>
        <span>新竹臺大分院 急診醫學部副主任</span>
        <span>臨床講師｜清華大學學習科學與科技研究所碩士班</span>
        <span class="spec">急救復甦教學 · 團隊資源管理（TRM）· 跨專業教育（IPE）· 模擬醫學 · 災難醫學</span>
      </div>
    </div>
    <div class="panel">
      <h3 id="statsTitle">📊 年度統計</h3>
      <div class="stats-grid">
        <div class="stat"><b id="stSessions">0</b><span>教學場次</span></div>
        <div class="stat"><b id="stHours">0</b><span>教學時數</span></div>
        <div class="stat"><b id="stLearners">0</b><span>學員人次</span></div>
        <div class="stat"><b id="stCerts">0</b><span>感謝狀／證明</span></div>
      </div>
      <div class="aud-bars" id="audBars"></div>
    </div>
  </div>

  <div class="main" id="mainCol">
    <div id="detailPage" style="display:none"></div>
    <div id="listView">
      <div class="toolbar">
        <input type="search" id="q" placeholder="搜尋課程名稱、地點、反思…">
        <select id="fRole"><option value="">全部身分</option><option>講師</option><option>學生</option><option>教學行政</option></select>
        <select id="fCat"><option value="">全部類別</option></select>
        <select id="fYear"><option value="">全部年份</option></select>
      </div>
      <div id="recList"><div class="empty"><div class="big">📚</div>載入中…</div></div>
    </div>
  </div>
</div>

<div class="foot-note">
  本頁為教學歷程的<b>公開版</b>，僅呈現課程場次、時數與教學反思。
  依個資保護原則，學員名單、學員回饋原文、上課照片與課程教材均<b>不對外公開</b>。
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 公開頁只讀 teaching_public 集合（規則：任何人可讀、僅本人可寫）。
   原始的 teaching_records 含學員名單與回饋原文，本頁完全不會碰。 */
const firebaseConfig = {
  apiKey:"AIzaSyBrs80vpFVe-iEh5ctzRWfYHUBb3KGvILo",
  authDomain:"speech-to-text-2f776.firebaseapp.com",
  projectId:"speech-to-text-2f776",
  storageBucket:"speech-to-text-2f776.firebasestorage.app",
  messagingSenderId:"283739023798",
  appId:"1:283739023798:web:3091ec2bcf6262b5ecb917"
};
const db = getFirestore(initializeApp(firebaseConfig));
const $ = id => document.getElementById(id);

const CATS = ["急救復甦", "TRM 團隊資源管理", "跨專業教育 IPE", "模擬醫學", "災難醫學", "臨床教學", "演講／課程", "教學會議", "其他"];
const WD = ["日","一","二","三","四","五","六"];
let records = [];

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const isFuture = r => r.date > todayStr();
function durationHours(r) {
  if (Number(r.hours) > 0) return Number(r.hours);
  if (!r.timeStart || !r.timeEnd) return 0;
  const [h1,m1] = r.timeStart.split(":").map(Number), [h2,m2] = r.timeEnd.split(":").map(Number);
  const mins = (h2*60+m2) - (h1*60+m1);
  return mins > 0 ? mins/60 : 0;
}

CATS.forEach(v => { const o = document.createElement("option"); o.value = o.textContent = v; $("fCat").appendChild(o); });
["q","fRole","fCat","fYear"].forEach(id => $(id).addEventListener("input", () => { renderList(); renderStats(); }));

/* ── 載入 ── */
(async () => {
  try {
    const snap = await getDocs(query(collection(db, "teaching_public"), orderBy("date", "desc")));
    records = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderYearOptions();
    renderStats();
    renderMain();
  } catch (e) {
    console.error(e);
    $("recList").innerHTML = '<div class="empty"><div class="big">⚠️</div>資料載入失敗，請稍後再試</div>';
  }
})();

function renderYearOptions() {
  const years = [...new Set(records.map(r => (r.date||"").slice(0,4)).filter(Boolean))].sort().reverse();
  years.forEach(y => { const o = document.createElement("option"); o.value = y; o.textContent = y + " 年"; $("fYear").appendChild(o); });
}

/* ── 統計 ── */
function renderStats() {
  const yFilter = $("fYear").value || String(new Date().getFullYear());
  $("statsTitle").textContent = `📊 ${yFilter} 年統計`;
  const ysAll = records.filter(r => (r.date||"").startsWith(yFilter) && !isFuture(r));
  const roleOf = r => r.role || "講師";
  const ys = ysAll.filter(r => roleOf(r) === "講師");
  const learn = ysAll.filter(r => roleOf(r) === "學生");
  const admin = ysAll.filter(r => roleOf(r) === "教學行政");
  $("stSessions").textContent = ys.length;
  $("stHours").textContent = Math.round(ys.reduce((s,r) => s + durationHours(r), 0) * 10) / 10;
  $("stLearners").textContent = ys.reduce((s,r) => s + (Number(r.audienceCount) || 0), 0);
  $("stCerts").textContent = ysAll.reduce((s,r) => s + (r.certs?.length || 0), 0);
  const cnt = {};
  ys.forEach(r => (r.audiences || []).forEach(a => cnt[a] = (cnt[a]||0) + 1));
  const max = Math.max(1, ...Object.values(cnt));
  const box = $("audBars"); box.innerHTML = "";
  Object.entries(cnt).sort((a,b) => b[1]-a[1]).forEach(([a,n]) => {
    box.insertAdjacentHTML("beforeend",
      `<div class="aud-bar"><span>${esc(a)}</span><span class="bar"><i style="width:${Math.round(n/max*100)}%"></i></span><b>${n}</b></div>`);
  });
  if (learn.length) {
    const lh = Math.round(learn.reduce((s,r) => s + durationHours(r), 0) * 10) / 10;
    box.insertAdjacentHTML("beforeend", `<div class="learn-line">🎓 進修課程：${learn.length} 場 · ${lh} 小時</div>`);
  }
  if (admin.length) {
    const ah = Math.round(admin.reduce((s,r) => s + durationHours(r), 0) * 10) / 10;
    box.insertAdjacentHTML("beforeend", `<div class="admin-line">🗂 教學行政：${admin.length} 場 · ${ah} 小時</div>`);
  }
}

/* ── 列表 ── */
function filteredRecords() {
  const q = $("q").value.trim().toLowerCase();
  const fc = $("fCat").value, fy = $("fYear").value, fr = $("fRole").value;
  return records.filter(r => {
    if (fr && (r.role || "講師") !== fr) return false;
    if (fy && !(r.date||"").startsWith(fy)) return false;
    if (fc && r.category !== fc) return false;
    if (q) {
      const hay = [r.title, r.reflection, r.location, r.category].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function renderList() {
  const list = filteredRecords();
  const box = $("recList"); box.innerHTML = "";
  if (!list.length) {
    box.innerHTML = `<div class="empty"><div class="big">🗂</div>${records.length ? "沒有符合條件的紀錄" : "尚未發布任何教學紀錄"}</div>`;
    return;
  }
  const today0 = todayStr();
  const upcoming = r => (r.date || "") >= today0;
  const byTime = (a, b) => a.date.localeCompare(b.date) || (a.timeStart || "").localeCompare(b.timeStart || "");
  list.sort((a, b) => {
    const au = upcoming(a), bu = upcoming(b);
    if (au !== bu) return au ? -1 : 1;
    return au ? byTime(a, b) : byTime(b, a);
  });
  const upCount = list.filter(upcoming).length;

  let curMonth = "", curGroup = null;
  list.forEach(r => {
    const grp = upcoming(r) ? "up" : "past";
    if (grp !== curGroup) {
      curGroup = grp; curMonth = "";
      box.insertAdjacentHTML("beforeend", `<div class="group-h${grp === "past" ? " past" : ""}">${
        grp === "up" ? `📌 即將進行<span class="cnt">${upCount} 場</span>`
                     : `✅ 已完成<span class="cnt">${list.length - upCount} 場</span>`}</div>`);
    }
    const mKey = (r.date||"").slice(0,7);
    if (mKey !== curMonth) {
      curMonth = mKey;
      const [yy,mm] = mKey.split("-");
      box.insertAdjacentHTML("beforeend", `<div class="month-h">${yy} 年 ${Number(mm)} 月</div>`);
    }
    const d = new Date(r.date + "T00:00:00");
    const role = r.role || "講師";
    const el = document.createElement("div");
    el.className = "rec" + (isFuture(r) ? " future" : "") + (role === "學生" ? " stud" : role === "教學行政" ? " admin" : "");
    el.innerHTML = `
      <div class="date"><b>${d.getDate()}</b><span>週${WD[d.getDay()]}</span></div>
      <div class="body">
        <div class="title">${esc(r.title)}</div>
        <div class="meta">
          ${isFuture(r) ? '<span class="tag future-tag">即將進行</span>' : ""}
          ${role === "學生" ? '<span class="tag stud">🎓 進修</span>' : role === "教學行政" ? '<span class="tag admin">🗂 教學行政</span>' : ""}
          ${r.category ? `<span class="tag cat">${esc(r.category)}</span>` : ""}
          ${r.method ? `<span class="tag method">${esc(r.method)}</span>` : ""}
          ${(r.audiences||[]).slice(0,3).map(a => `<span class="tag aud">${esc(a)}</span>`).join("")}
          ${r.timeStart ? `<span>${esc(r.timeStart)}${r.timeEnd ? "–" + esc(r.timeEnd) : ""}</span>` : ""}
          ${r.location ? `<span>📍${esc(r.location)}</span>` : ""}
        </div>
      </div>
      <div class="marks" title="感謝狀／教學反思">
        <span class="${r.certs?.length ? "on" : ""}" title="感謝狀 ${r.certs?.length||0} 張">🏆</span>
        <span class="${r.reflection ? "on" : ""}" title="教學反思">🪞</span>
      </div>`;
    el.onclick = () => { location.hash = "rec=" + encodeURIComponent(r.id); };
    box.appendChild(el);
  });
}

/* ── 詳情頁 ── */
function currentDetailId() {
  const m = location.hash.match(/^#rec=(.+)$/);
  return m ? decodeURIComponent(m[1]) : null;
}
function renderMain() {
  const id = currentDetailId();
  if (id) { $("listView").style.display = "none"; $("detailPage").style.display = "block"; renderDetail(id); }
  else { $("detailPage").style.display = "none"; $("listView").style.display = "block"; renderList(); }
}
window.addEventListener("hashchange", () => { renderMain(); window.scrollTo(0, 0); });
if (currentDetailId()) history.replaceState(null, "", location.pathname + location.search);

function fileIcon(name) {
  if (/\.pdf$/i.test(name)) return "📕";
  if (/\.(png|jpe?g|heic|gif|webp)$/i.test(name)) return "🖼";
  return "📄";
}
function thumbCard(f) {
  const isImg = /\.(png|jpe?g|heic|gif|webp)$/i.test(f.name || "");
  const isPdf = /\.pdf$/i.test(f.name || "");
  let preview;
  if (f.url && isImg) preview = `<img src="${esc(f.url)}" alt="${esc(f.name)}" loading="lazy">`;
  else if (f.url && isPdf) preview = `<iframe src="${esc(f.url)}#toolbar=0&navpanes=0&scrollbar=0&view=FitH" loading="lazy" title="${esc(f.name)}"></iframe>`;
  else preview = `<span class="bigico">${fileIcon(f.name || "")}</span>`;
  return `<a class="thumb-card" href="${esc(f.url)}" target="_blank" rel="noopener">
    <div class="tc-preview">${preview}<span class="open-hint">開啟</span></div>
    <div class="tc-name">${esc(f.name || "檔案")}</div></a>`;
}

function renderDetail(id) {
  const page = $("detailPage");
  const r = records.find(x => x.id === id);
  if (!r) {
    page.innerHTML = `<div class="detail-head"><button class="backbtn" onclick="location.hash=''">← 返回列表</button></div>
      <div class="detail-sec"><div class="none">${records.length ? "找不到這筆紀錄" : "載入中…"}</div></div>`;
    return;
  }
  const d = new Date(r.date + "T00:00:00");
  const role = r.role || "講師";
  const meta = [];
  meta.push(`<span class="tag method">${esc(r.date)}（週${WD[d.getDay()]}）${r.timeStart ? " " + esc(r.timeStart) + (r.timeEnd ? "–" + esc(r.timeEnd) : "") : ""}</span>`);
  if (isFuture(r)) meta.push('<span class="tag future-tag">即將進行</span>');
  meta.push(role === "學生" ? '<span class="tag stud">🎓 學生（進修）</span>'
          : role === "教學行政" ? '<span class="tag admin">🗂 教學行政</span>'
          : '<span class="tag aud">👨‍🏫 講師</span>');
  if (r.category) meta.push(`<span class="tag cat">${esc(r.category)}</span>`);
  if (r.method) meta.push(`<span class="tag method">${esc(r.method)}</span>`);
  (r.audiences||[]).forEach(a => meta.push(`<span class="tag aud">${esc(a)}</span>`));
  if (r.audienceCount) meta.push(`<span class="tag aud">👥 ${Number(r.audienceCount)} 人</span>`);
  if (Number(r.hours) > 0) meta.push(`<span class="tag method">⏱ 共 ${Number(r.hours)} 小時</span>`);
  if (r.location) meta.push(`<span class="tag method">📍 ${esc(r.location)}</span>`);

  const certs = r.certs || [];
  page.innerHTML = `
    <div class="detail-head">
      <button class="backbtn" id="backBtn">← 返回列表</button>
      <h2>${esc(r.title)}</h2>
    </div>
    <div class="detail-sec">
      <div class="v-meta" style="margin-bottom:0">${meta.join("")}</div>
    </div>
    ${r.reflection ? `<div class="detail-sec"><h3>🪞 教學反思</h3><div class="refl-card">${esc(r.reflection)}</div></div>` : ""}
    ${certs.length ? `<div class="detail-sec"><h3>🏆 感謝狀與上課證明</h3><div class="thumb-grid">${certs.map(thumbCard).join("")}</div></div>` : ""}`;
  $("backBtn").onclick = () => { location.hash = ""; };
}
</script>
</body>
</html>
